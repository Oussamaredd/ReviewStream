[project]
name = "reviewstream"
version = "0.1.0"
description = "Live customer review streaming pipeline using FastAPI, Kafka, and Spark Structured Streaming."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["backend", "spark"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "dotenv",
    "dotenv.*",
    "kafka",
    "kafka.*",
    "pyhive",
    "pyhive.*",
    "pyspark",
    "pyspark.*",
]
ignore_missing_imports = true

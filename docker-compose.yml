services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: reviewstream-kafka
    hostname: kafka
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: reviewstream-namenode
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CLUSTER_NAME: reviewstream
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_client_use_datanode_hostname: "true"
      HADOOP_HEAPSIZE: 512
      HDFS_NAMENODE_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: reviewstream-datanode
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    depends_on:
      - namenode
    ports:
      - "9864:9864"
      - "9866:9866"
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_datanode_hostname: host.docker.internal
      HDFS_CONF_dfs_client_use_datanode_hostname: "true"
      HADOOP_HEAPSIZE: 512
      HDFS_DATANODE_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data

  hive-metastore-db:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: reviewstream-hive-metastore-db
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    volumes:
      - hive_metastore_db_data:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: reviewstream-hive-metastore
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db
    ports:
      - "9083:9083"
    environment:
      HADOOP_CLIENT_OPTS: "-Xmx512m"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_client_use_datanode_hostname: "true"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db:5432/metastore
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: hive
      HIVE_SITE_CONF_datanucleus_autoCreateSchema: "false"
      HIVE_SITE_CONF_hive_metastore_schema_verification: "true"
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-db:5432"
    command: /opt/hive/bin/hive --service metastore

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: reviewstream-hive-server
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1536m
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      HADOOP_CLIENT_OPTS: "-Xmx1024m"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_client_use_datanode_hostname: "true"
      HIVE_SITE_CONF_hive_server2_authentication: "NOSASL"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db:5432/metastore
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: hive
      HIVE_SITE_CONF_hive_metastore_uris: thrift://hive-metastore:9083
      SERVICE_PRECONDITION: "hive-metastore:9083"

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_db_data:
